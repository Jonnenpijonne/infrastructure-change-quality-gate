name: Infrastructure Change Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'templates/**'
      - 'docs/**'
      - 'examples/**'
      - 'validation/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'gatehouse.yaml'
      - 'install.sh'
      - 'ARCHITECTURE.md'
      - 'SECURITY.md'
      - 'README.md'

  # Allow manual trigger for demo purposes
  workflow_dispatch:
    inputs:
      change_request_file:
        description: 'Path to change request file (relative)'
        required: true
        default: 'examples/example-change-request.md'

jobs:
  validate-change-request:
    name: Quality Gate - Validate Change Request
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find validation input files
        id: find-files
        shell: bash
        run: |
          set -e

          # Manual dispatch: validate exactly the file selected by the caller.
          if [ -n "${{ github.event.inputs.change_request_file }}" ]; then
            FILE="${{ github.event.inputs.change_request_file }}"
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Requested validation file does not exist: $FILE"
              exit 1
            fi
            echo "files=$FILE" >> "$GITHUB_OUTPUT"
            echo "source=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pull requests: validate modified change-request/template files when present.
          FILES=$(git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- 'examples/*.md' 'templates/*.md' | tr '\n' ' ')

          if [ -n "$FILES" ]; then
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
            echo "source=changed_inputs" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Docs/workflow/validator-only PRs still exercise the policy engine against
          # a known valid baseline instead of failing merely because no input document
          # was modified in the PR.
          SMOKE_TEST="examples/example-class2-cicd-pipeline-update.md"
          if [ ! -f "$SMOKE_TEST" ]; then
            echo "ERROR: Smoke-test input is missing: $SMOKE_TEST"
            exit 1
          fi

          echo "files=$SMOKE_TEST" >> "$GITHUB_OUTPUT"
          echo "source=smoke_test" >> "$GITHUB_OUTPUT"

      - name: Run quality gate validation
        run: |
          echo "=================================================="
          echo "  Infrastructure Change Quality Gate"
          echo "  ISO 27001-aligned validation"
          echo "  Input source: ${{ steps.find-files.outputs.source }}"
          echo "=================================================="
          echo ""

          VALIDATION_FAILED=0

          for file in ${{ steps.find-files.outputs.files }}; do
            echo "Validating: $file"
            echo "--------------------------------------------------"

            python ./validation/pre-merge-checks/validate-change-request.py "$file" || {
              VALIDATION_FAILED=1
              echo ""
              echo "FAILED: $file did not pass quality gate."
              echo ""
            }
          done

          if [ "$VALIDATION_FAILED" -eq 1 ]; then
            echo ""
            echo "=================================================="
            echo "  QUALITY GATE: BLOCKED"
            echo "  Fix the validation errors above and update the PR."
            echo "=================================================="
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "  QUALITY GATE: ALL CHECKS PASSED"
          echo "=================================================="

      - name: Post validation summary
        if: always() && github.event_name == 'pull_request'
        run: |
          echo "## Quality Gate Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Input source: \`${{ steps.find-files.outputs.source }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated files: \`${{ steps.find-files.outputs.files }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.find-files.outputs.source }}" = "smoke_test" ]; then
            echo "No change-request/template input was modified in this PR, so the validator was exercised against the known valid baseline." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The modified validation input(s) were checked directly." >> "$GITHUB_STEP_SUMMARY"
          fi

  unit-tests:
    name: Quality Gate - Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  lint-check:
    name: Quality Gate - Lint & Syntax
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile ./validation/pre-merge-checks/validate-change-request.py
          echo "Python syntax OK"

      - name: Check for CRLF line endings
        run: |
          CRLF_FILES=$(grep -rl $'\r' --include='*.md' --include='*.py' --include='*.yml' . || true)
          if [ -n "$CRLF_FILES" ]; then
            echo "ERROR: CRLF line endings detected in:"
            echo "$CRLF_FILES"
            exit 1
          fi
          echo "Line endings OK (all LF)"

      - name: Check for absolute paths
        run: |
          ABS_PATHS=$(grep -rn '[A-Z]:\\' --include='*.md' --include='*.py' --include='*.yml' . || true)
          UNIX_ABS=$(grep -rn '"/\(Users\|home\|etc\|var\)/' --include='*.md' --include='*.py' --include='*.yml' . || true)
          if [ -n "$ABS_PATHS" ] || [ -n "$UNIX_ABS" ]; then
            echo "ERROR: Absolute paths detected:"
            echo "$ABS_PATHS"
            echo "$UNIX_ABS"
            exit 1
          fi
          echo "Path check OK (all relative)"
